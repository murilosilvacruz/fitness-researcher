<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Corpo e Saber — Research</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ── Brand ── */
      --magenta:         #b915d8;
      --magenta-hover:   #9d12b8;
      --magenta-light:   #f9e5ff;
      --mauve:           #be95c3;
      --blush:           #ffe7ff;
      --teal:            #5cbab3;
      --teal-light:      #e0f5f3;

      /* ── Warm neutrals (aubergine-tinted) ── */
      --ink-900: #1a0d1e;
      --ink-700: #3d2545;
      --ink-500: #7a6680;
      --ink-300: #b8a8be;
      --ink-200: #e2d8e8;
      --ink-100: #f2ecf5;
      --ink-50:  #f8f5fa;

      /* ── Semantic ── */
      --color-success: #449d96;
      --color-warning: #e59b3b;
      --color-danger:  #c94761;
      --color-info:    #be95c3;

      /* ── Aliases ── */
      --bg:           var(--ink-50);
      --surface:      #ffffff;
      --surface-2:    var(--ink-100);
      --border:       var(--ink-200);
      --text:         var(--ink-900);
      --text-muted:   var(--ink-500);
      --accent:       var(--magenta);
      --accent-light: var(--magenta-light);
      --accent-hover: var(--magenta-hover);
      --green:        var(--color-success);
      --green-light:  var(--teal-light);
      --badge-bg:     var(--ink-100);

      /* ── Radii ── */
      --radius-xs:   6px;
      --radius-sm:   10px;
      --radius-md:   16px;
      --radius-lg:   24px;
      --radius-xl:   32px;
      --radius-pill: 999px;
      --radius:      var(--radius-lg);

      /* ── Shadows (magenta-tinted) ── */
      --shadow-xs:   0 1px 3px rgba(185, 21, 216, .06);
      --shadow-sm:   0 2px 8px rgba(185, 21, 216, .08), 0 1px 2px rgba(185, 21, 216, .04);
      --shadow-md:   0 4px 16px rgba(185, 21, 216, .12), 0 2px 4px rgba(185, 21, 216, .06);
      --shadow-lg:   0 8px 32px rgba(185, 21, 216, .18);
      --shadow-glow: 0 0 0 6px rgba(185, 21, 216, .12);
      --shadow:      var(--shadow-sm);

      /* ── Motion ── */
      --ease-out:  cubic-bezier(0.22, 0.61, 0.36, 1);
      --ease-soft: cubic-bezier(0.34, 1.2, 0.64, 1);
      --dur-fast:  160ms;
      --dur-base:  260ms;
      --dur-slow:  420ms;

      --sidebar-w: 264px;
    }

    body {
      font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      font-size: 15px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    header {
      background: rgba(255, 255, 255, .88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 8px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .logo {
      font-size: 15px; font-weight: 700; letter-spacing: -.2px;
      display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .logo .brand { color: var(--magenta); }
    .logo .sep { color: var(--ink-300); font-weight: 400; margin: 0 2px; }
    .logo .section { color: var(--ink-500); font-weight: 500; }
    .header-actions { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }

    /* ── Menu button (mobile only) ── */
    #menuBtn {
      display: none;
      align-items: center; justify-content: center;
      background: none; border: none;
      padding: 8px; border-radius: var(--radius-sm);
      cursor: pointer; color: var(--text); flex-shrink: 0;
      transition: background var(--dur-fast) var(--ease-out);
    }
    #menuBtn:hover { background: var(--surface-2); }
    #menuBtn:focus-visible { outline: none; box-shadow: var(--shadow-glow); }

    /* ── Run button ── */
    #runBtn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius-pill);
      padding: 8px 20px; font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit; letter-spacing: .01em;
      transition: background var(--dur-fast) var(--ease-out),
        transform var(--dur-fast) var(--ease-out),
        box-shadow var(--dur-fast) var(--ease-out);
      white-space: nowrap;
    }
    #runBtn:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }
    #runBtn:active:not(:disabled) { transform: scale(.98); box-shadow: var(--shadow-xs); }
    #runBtn:focus-visible { outline: none; box-shadow: var(--shadow-glow); }
    #runBtn:disabled { opacity: .45; cursor: not-allowed; }
    #runBtn svg { width: 14px; height: 14px; flex-shrink: 0; }
    .spinner { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #statusMsg {
      font-size: 13px; color: var(--text-muted); font-weight: 500;
      max-width: 180px; text-align: right;
    }

    /* ── Layout ── */
    .layout { display: flex; flex: 1; position: relative; }

    /* ── Sidebar overlay (mobile) ── */
    #sidebarOverlay {
      display: none; position: fixed; inset: 0; top: 60px;
      background: rgba(26, 13, 30, .5); z-index: 60;
    }
    #sidebarOverlay.open { display: block; }

    /* ── Sidebar ── */
    aside {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px 0;
      position: sticky;
      top: 60px;
      height: calc(100vh - 60px);
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: var(--teal);
      padding: 0 20px 12px;
    }
    .week-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; cursor: pointer;
      border-radius: var(--radius-md);
      margin: 2px 8px;
      transition: background var(--dur-fast) var(--ease-out);
    }
    .week-item:hover { background: var(--surface-2); }
    .week-item.active { background: var(--magenta-light); }
    .week-item.active .week-label { color: var(--magenta); }
    .week-label { font-size: 13px; font-weight: 600; transition: color var(--dur-fast); }
    .week-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-weight: 500; }
    .week-pill {
      font-size: 11px; font-weight: 700;
      background: var(--badge-bg); color: var(--text-muted);
      border-radius: var(--radius-pill); padding: 2px 9px; white-space: nowrap;
    }
    .week-pill.done { background: var(--teal-light); color: var(--color-success); }

    /* ── Nav tabs ── */
    .nav-tabs {
      display: flex; gap: 0;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, .88);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      padding: 0 20px;
      position: sticky; top: 60px; z-index: 50;
    }
    .nav-tab {
      padding: 14px 18px; font-size: 13px; font-weight: 700;
      border: none; background: none; cursor: pointer;
      color: var(--text-muted); font-family: inherit; letter-spacing: .01em;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: color var(--dur-fast), border-color var(--dur-fast);
      white-space: nowrap;
    }
    .nav-tab:hover { color: var(--text); }
    .nav-tab.active { color: var(--magenta); border-bottom-color: var(--magenta); }
    .nav-tab:focus-visible { outline: none; box-shadow: var(--shadow-glow); }
    .tab-badge {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--badge-bg); border-radius: var(--radius-pill);
      font-size: 10px; font-weight: 700; padding: 1px 7px; margin-left: 6px;
    }
    .tab-badge.pending { background: #fef0e0; color: #9b5a10; }
    .tab-badge.approved { background: var(--teal-light); color: var(--color-success); }

    /* ── Main ── */
    main { flex: 1; padding: 32px 36px; max-width: 900px; min-width: 0; }

    .main-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }
    .main-title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
    .main-meta { font-size: 13px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }

    /* ── Filters ── */
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .filter-btn {
      font-size: 13px; font-weight: 700;
      padding: 6px 16px; border-radius: var(--radius-pill);
      border: 1.5px solid var(--border);
      background: var(--surface); cursor: pointer;
      font-family: inherit; letter-spacing: .01em; color: var(--text-muted);
      transition: border-color var(--dur-fast) var(--ease-out),
        color var(--dur-fast) var(--ease-out),
        transform var(--dur-fast) var(--ease-out),
        box-shadow var(--dur-fast) var(--ease-out);
    }
    .filter-btn:hover {
      border-color: var(--mauve); color: var(--text);
      transform: translateY(-1px); box-shadow: var(--shadow-xs);
    }
    .filter-btn.active {
      background: var(--accent); border-color: var(--accent);
      color: #fff; box-shadow: var(--shadow-sm);
    }
    .filter-btn:focus-visible { outline: none; box-shadow: var(--shadow-glow); }

    /* ── Article card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow var(--dur-base) var(--ease-out),
        transform var(--dur-base) var(--ease-out),
        opacity var(--dur-base);
    }
    .card.read { opacity: .55; }
    .card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .card.read .card-body { display: none; }
    .card.read.expanded .card-body { display: block; }

    .card-top { display: flex; align-items: flex-start; gap: 14px; }
    .read-check {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--border);
      cursor: pointer; flex-shrink: 0; margin-top: 1px;
      background: var(--surface);
      transition: all var(--dur-fast) var(--ease-out);
      display: flex; align-items: center; justify-content: center;
    }
    .read-check:hover { border-color: var(--teal); }
    .read-check.checked { background: var(--teal); border-color: var(--teal); }
    .read-check.checked::after { content: "✓"; color: #fff; font-size: 11px; font-weight: 700; }

    .card-info { flex: 1; min-width: 0; }
    .card-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: var(--teal); margin-bottom: 5px;
    }
    .card-title { font-size: 15px; font-weight: 700; line-height: 1.45; margin-bottom: 6px; }
    .card-title a { color: inherit; text-decoration: none; }
    .card-title a:hover { color: var(--magenta); }
    .card-source {
      font-size: 13px; color: var(--text-muted); font-weight: 500;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-300); }
    .card-title-en {
      font-size: 13px; color: var(--text-muted); font-style: italic;
      margin-top: 2px; margin-bottom: 4px;
    }

    .expand-btn {
      display: none; align-items: center; justify-content: center;
      background: none; border: none; color: var(--text-muted); cursor: pointer;
      padding: 4px; flex-shrink: 0;
      border-radius: var(--radius-sm);
      transition: transform var(--dur-base) var(--ease-soft), color var(--dur-fast), background var(--dur-fast);
    }
    .expand-btn:hover { color: var(--text); background: var(--surface-2); }
    .expand-btn svg { width: 16px; height: 16px; }
    .card.read .expand-btn { display: flex; }
    .card.read.expanded .expand-btn { transform: rotate(180deg); }

    .card-body { margin-top: 16px; }

    .summary-section { margin-bottom: 16px; }
    .summary-section-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: var(--text-muted); margin-bottom: 6px;
    }
    .summary-text { font-size: 14px; line-height: 1.7; color: var(--ink-700); white-space: pre-wrap; }

    /* ── Toggle row ── */
    .toggle-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .toggle-btn {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 13px; font-weight: 600; color: var(--text-muted);
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 5px 14px; cursor: pointer; font-family: inherit;
      transition: all var(--dur-fast) var(--ease-out);
    }
    .toggle-btn:hover {
      background: var(--border); color: var(--text);
      transform: translateY(-1px); box-shadow: var(--shadow-xs);
    }
    .toggle-btn:focus-visible { outline: none; box-shadow: var(--shadow-glow); }

    /* ── Play button ── */
    .play-btn {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 13px; font-weight: 600; color: var(--text-muted);
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 5px 14px; cursor: pointer; font-family: inherit;
      transition: all var(--dur-fast) var(--ease-out);
    }
    .play-btn:hover {
      background: var(--border); color: var(--text);
      transform: translateY(-1px); box-shadow: var(--shadow-xs);
    }
    .play-btn.playing {
      background: var(--magenta-light); color: var(--magenta);
      border-color: rgba(185, 21, 216, .2);
    }
    .play-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

    /* ── Published row ── */
    .published-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .published-checkbox {
      width: 16px; height: 16px; cursor: pointer;
      accent-color: var(--teal); flex-shrink: 0;
    }
    .published-label {
      font-size: 13px; color: var(--text-muted); font-weight: 500;
      cursor: pointer; user-select: none;
    }
    .published-label.checked { color: var(--teal); font-weight: 700; }

    /* ── Content panels ── */
    .ig-panel {
      margin-top: 16px;
      background: var(--magenta-light);
      border: 1px solid rgba(185, 21, 216, .15);
      border-radius: var(--radius-md); padding: 16px 18px;
    }
    .ig-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: var(--magenta); margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .ig-text { font-size: 14px; line-height: 1.7; white-space: pre-wrap; color: var(--ink-700); }
    .copy-btn {
      margin-top: 12px; font-size: 13px; font-weight: 700;
      padding: 6px 16px; border-radius: var(--radius-pill);
      border: 1.5px solid var(--magenta); color: var(--magenta);
      background: transparent; cursor: pointer; font-family: inherit;
      transition: all var(--dur-fast) var(--ease-out);
    }
    .copy-btn:hover {
      background: var(--magenta); color: #fff;
      transform: translateY(-1px); box-shadow: var(--shadow-sm);
    }
    .copy-btn.copied { background: var(--teal); border-color: var(--teal); color: #fff; }
    .copy-btn:focus-visible { outline: none; box-shadow: var(--shadow-glow); }

    /* ── Summary panel ── */
    .summary-panel {
      margin-top: 16px;
      background: var(--teal-light);
      border: 1px solid rgba(68, 157, 150, .25);
      border-radius: var(--radius-md); padding: 16px 18px;
    }
    .summary-panel .ig-label { color: var(--teal); }

    /* ── Review queue ── */
    .review-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }
    .review-filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .status-pill {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; padding: 3px 10px; border-radius: var(--radius-pill);
    }
    .status-pill.APPROVED   { background: var(--teal-light);  color: var(--color-success); }
    .status-pill.PENDING_REVIEW { background: #fef0e0; color: #9b5a10; }
    .status-pill.REJECTED   { background: #fce7ec; color: var(--color-danger); }
    .status-pill.NO_EVAL    { background: var(--badge-bg); color: var(--text-muted); }

    .review-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 16px;
      box-shadow: var(--shadow-sm); overflow: hidden;
      transition: box-shadow var(--dur-base) var(--ease-out);
    }
    .review-card:hover { box-shadow: var(--shadow-md); }
    .review-card-header {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 22px; cursor: pointer;
      border-bottom: 1px solid transparent;
      transition: background var(--dur-fast) var(--ease-out);
    }
    .review-card-header:hover { background: var(--surface-2); }
    .review-card.expanded .review-card-header { border-bottom-color: var(--border); }
    .review-card-title { flex: 1; font-size: 14px; font-weight: 700; min-width: 0; }
    .review-card-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; font-weight: 500; }
    .review-card-body { padding: 20px 22px; }

    .eval-scores { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .score-chip {
      font-size: 12px; font-weight: 600;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius-pill); padding: 4px 12px;
      display: flex; align-items: center; gap: 5px;
    }
    .score-chip .score-val { color: var(--mauve); }
    .score-chip.good .score-val { color: var(--teal); }
    .score-chip.bad  .score-val { color: var(--color-danger); }

    .review-content-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 14px; margin-bottom: 16px;
    }
    @media (max-width: 700px) { .review-content-grid { grid-template-columns: 1fr; } }
    .review-content-box {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 14px;
    }
    .review-content-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: var(--text-muted); margin-bottom: 8px;
    }
    .review-content-text {
      font-size: 13px; line-height: 1.65; white-space: pre-wrap;
      color: var(--ink-700); max-height: 180px; overflow-y: auto;
    }

    .llm-feedback {
      background: var(--magenta-light);
      border: 1px solid rgba(185, 21, 216, .15);
      border-radius: var(--radius-md); padding: 14px; margin-bottom: 14px;
    }
    .llm-feedback-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: var(--magenta); margin-bottom: 6px;
    }
    .llm-feedback-text { font-size: 13px; line-height: 1.6; }

    .review-actions { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
    .review-note-input {
      flex: 1; min-width: 200px; font-size: 14px; padding: 8px 12px;
      border: 1.5px solid var(--border); border-radius: var(--radius-md);
      background: var(--surface); color: var(--text);
      font-family: inherit; resize: vertical;
      transition: border-color var(--dur-fast), box-shadow var(--dur-fast);
    }
    .review-note-input:focus { outline: none; border-color: var(--magenta); box-shadow: var(--shadow-glow); }
    .btn-approve {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--teal); color: #fff;
      border: none; border-radius: var(--radius-pill); padding: 8px 20px;
      font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
      transition: all var(--dur-fast) var(--ease-out);
    }
    .btn-approve:hover { opacity: .9; transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .btn-approve:focus-visible { outline: none; box-shadow: var(--shadow-glow); }
    .btn-reject {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--color-danger); color: #fff;
      border: none; border-radius: var(--radius-pill); padding: 8px 20px;
      font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
      transition: all var(--dur-fast) var(--ease-out);
    }
    .btn-reject:hover { opacity: .9; transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .btn-reject:focus-visible { outline: none; box-shadow: var(--shadow-glow); }

    /* ── Image modal ── */
    .img-modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(26, 13, 30, .92); z-index: 200;
      align-items: center; justify-content: center; cursor: zoom-out;
    }
    .img-modal-overlay.open { display: flex; }
    .img-modal-img {
      max-width: min(88vw, 560px); max-height: 88vh;
      border-radius: var(--radius-lg); object-fit: contain;
      box-shadow: var(--shadow-lg); cursor: default;
    }
    .img-modal-close {
      position: fixed; top: 20px; right: 24px;
      background: rgba(255,255,255,.12); border: none;
      color: #fff; font-size: 18px; line-height: 1; cursor: pointer;
      border-radius: 50%; width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(8px);
      transition: background var(--dur-fast);
    }
    .img-modal-close:hover { background: rgba(255,255,255,.24); }

    /* ── Empty / loading ── */
    .state-msg {
      text-align: center; padding: 80px 20px;
      color: var(--text-muted); font-size: 15px; line-height: 1.7;
    }
    .state-msg strong { display: block; font-size: 20px; color: var(--text); margin-bottom: 10px; font-weight: 700; }

    .skeleton {
      background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 50%, var(--surface-2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius-sm);
    }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .sk-line  { height: 14px; margin-bottom: 10px; border-radius: var(--radius-xs); }
    .sk-title { height: 20px; width: 75%; margin-bottom: 12px; border-radius: var(--radius-xs); }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      #menuBtn { display: flex; }
      #statusMsg { display: none; }
      #runBtn .btn-label { display: none; }
      #runBtn { padding: 8px 12px; }

      aside {
        position: fixed; top: 60px; left: 0;
        width: min(var(--sidebar-w), 80vw);
        height: calc(100vh - 60px);
        z-index: 70;
        transform: translateX(-110%);
        transition: transform var(--dur-slow) var(--ease-out);
        box-shadow: var(--shadow-lg);
      }
      aside.open { transform: translateX(0); }

      main { padding: 20px; }
      .card { padding: 16px 18px; }
      .main-title { font-size: 19px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <button id="menuBtn" onclick="toggleSidebar()" aria-label="Abrir menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="logo">
      <span class="brand">Corpo e Saber</span>
      <span class="sep">—</span>
      <span class="section">Research</span>
    </div>
  </div>
  <div class="header-actions">
    <div id="statusMsg"></div>
    <button id="runBtn" onclick="runResearch()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M10 8l6 4-6 4V8z" fill="currentColor" stroke="none"/>
      </svg>
      <span class="btn-label">Nova pesquisa</span>
    </button>
  </div>
</header>

<div id="sidebarOverlay" onclick="closeSidebar()"></div>

<nav class="nav-tabs">
  <button class="nav-tab active" id="tab-research" onclick="switchTab('research')">Pesquisas</button>
  <button class="nav-tab" id="tab-queue" onclick="switchTab('queue')">
    Fila de publicação
    <span class="tab-badge pending" id="queue-badge" style="display:none"></span>
  </button>
</nav>

<div class="layout">
  <aside id="sidebar">
    <div class="sidebar-title">Pesquisas</div>
    <div id="weekList"><div style="padding:18px 20px;font-size:13px;color:var(--text-muted)">Carregando...</div></div>
  </aside>

  <main>
    <div id="content">
      <div class="state-msg">
        <strong>Selecione uma pesquisa</strong>
        Escolha uma data na barra lateral para ver os artigos.
      </div>
    </div>
    <div id="queue-content" style="display:none">
      <div class="state-msg"><strong>Carregando fila...</strong></div>
    </div>
  </main>
</div>

<div id="imageModal" class="img-modal-overlay" onclick="handleModalClick(event)">
  <button class="img-modal-close" onclick="closeImageModal()" title="Fechar">✕</button>
  <img id="imageModalImg" class="img-modal-img" src="" alt="Background do post" onclick="event.stopPropagation()">
</div>

<script>
  let currentDate = null;
  let allArticles = [];
  let currentRunMeta = null;
  let activeFilter = 'all';
  let pollingInterval = null;

  const captionMap = {};

  // ── Boot ──────────────────────────────────────────────────────────────────
  loadRuns();

  async function loadRuns() {
    const res = await fetch('/api/runs');
    const runs = await res.json();
    renderSidebar(runs);
    if (runs.length > 0) selectRun(runs[0].date);
  }

  function renderSidebar(runs) {
    const el = document.getElementById('weekList');
    if (!runs.length) {
      el.innerHTML = '<div style="padding:18px 20px;font-size:13px;color:var(--text-muted)">Nenhum relatório ainda.</div>';
      return;
    }
    el.innerHTML = runs.map(r => {
      const allDone = r.read === r.total && r.total > 0;
      return `
        <div class="week-item" id="run-${r.date}" onclick="selectRun('${r.date}')">
          <div>
            <div class="week-label">${formatDateLabel(r.date)}</div>
            <div class="week-meta">${formatTime(r.generated_at)}</div>
          </div>
          <div class="week-pill ${allDone ? 'done' : ''}">${r.read}/${r.total}</div>
        </div>`;
    }).join('');
  }

  async function selectRun(date) {
    currentDate = date;
    activeFilter = 'all';
    document.querySelectorAll('.week-item').forEach(el => el.classList.remove('active'));
    const item = document.getElementById(`run-${date}`);
    if (item) item.classList.add('active');

    closeSidebar();
    stopAudio();

    document.getElementById('content').innerHTML = renderSkeletons();
    const res = await fetch(`/api/runs/${date}`);
    const data = await res.json();
    allArticles = data.articles;
    currentRunMeta = { date: data.date, generated_at: data.generated_at, labels: data.labels };

    for (const a of allArticles) {
      if (a.instagram_caption) captionMap[a.id] = a.instagram_caption;
    }

    renderContent();
  }

  function renderContent() {
    if (!currentRunMeta) return;
    const labels = ['all', ...currentRunMeta.labels];
    const filtered = activeFilter === 'all'
      ? allArticles
      : allArticles.filter(a => a.label === activeFilter);
    const readCount = allArticles.filter(a => a.read).length;

    document.getElementById('content').innerHTML = `
      <div class="main-header">
        <div>
          <div class="main-title">${formatDateLabel(currentRunMeta.date)}</div>
          <div class="main-meta">Gerado às ${formatTime(currentRunMeta.generated_at)} · ${allArticles.length} artigos · ${readCount} lidos</div>
        </div>
      </div>
      <div class="filters">
        ${labels.map(l => `<button class="filter-btn ${activeFilter === l ? 'active' : ''}" onclick="setFilter('${escapeAttr(l)}')">${l === 'all' ? 'Todos' : escapeHtml(l)}</button>`).join('')}
      </div>
      <div id="articleList">
        ${filtered.map(renderCard).join('')}
      </div>`;
  }

  function setFilter(label) {
    activeFilter = label;
    renderContent();
  }

  function renderCard(a) {
    const titlePt = a.title_pt || a.title || '';
    const titleEn = (a.title_en && a.title_en !== titlePt) ? a.title_en : '';
    const date = currentDate;
    const isPublished = getPublishedState(date, a.id) || !!a.published_instagram;

    return `
      <div class="card ${a.read ? 'read' : ''}" id="card-${a.id}">
        <div class="card-top">
          <div class="read-check ${a.read ? 'checked' : ''}" onclick="toggleRead('${a.id}', !this.classList.contains('checked'))" title="Marcar como lido / não lido"></div>
          <div class="card-info" onclick="if(this.closest('.card').classList.contains('read')) toggleExpand('${a.id}')" style="${a.read ? 'cursor:pointer' : ''}">
            <div class="card-label">${escapeHtml(a.label)}</div>
            <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escapeHtml(titlePt)}</a></div>
            ${titleEn && titleEn !== titlePt ? `<div class="card-title-en">${escapeHtml(titleEn)}</div>` : ''}
            <div class="card-source">
              <span>${escapeHtml(a.source)}</span>
              <span class="dot"></span>
              <span>${escapeHtml(a.published_date)}</span>
            </div>
          </div>
          <button class="expand-btn" onclick="toggleExpand('${a.id}')" title="Expandir">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
        <div class="card-body">
          ${a.objective
            ? renderSummarySection('Objetivo e hipótese', a.objective) +
              renderSummarySection('Conclusão', a.conclusion) +
              renderSummarySection('Dados de suporte', a.supporting_data)
            : renderSummarySection('Resumo', a.summary || '')}
          <div class="toggle-row">
            <button class="play-btn" id="play-${a.id}" onclick="toggleAudio('${a.id}')">
              <svg id="play-icon-${a.id}" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <span id="play-label-${a.id}">Ouvir</span>
            </button>
            <button class="toggle-btn" onclick="toggleCaptionPanel('${date}', '${a.id}')">Ver legenda</button>
            <button class="toggle-btn" onclick="toggleSummaryPanel('${date}', '${a.id}')">Ver texto do post</button>
            ${a.has_background ? `<button class="toggle-btn" onclick="openImageModal('${date}', '${a.id}')">Ver imagem</button>` : ''}
          </div>
          <div class="published-row">
            <input type="checkbox" class="published-checkbox" id="pub-${a.id}" ${isPublished ? 'checked' : ''}
              onchange="togglePublished('${date}', '${a.id}', this.checked)">
            <label for="pub-${a.id}" class="published-label ${isPublished ? 'checked' : ''}">Publicado no Instagram</label>
          </div>
          <div class="ig-panel" id="ig-${a.id}" style="display:none">
            <div class="ig-label">Legenda do post</div>
            <div class="ig-text" id="ig-text-${a.id}">Carregando...</div>
            <button class="copy-btn" id="copy-${a.id}" onclick="copyCaption('${a.id}')">Copiar legenda</button>
          </div>
          <div class="ig-panel summary-panel" id="summary-panel-${a.id}" style="display:none">
            <div class="ig-label">Texto do post (summary.txt)</div>
            <div class="ig-text" id="summary-text-${a.id}">Carregando...</div>
          </div>
        </div>
      </div>`;
  }

  function renderSummarySection(title, text) {
    if (!text) return '';
    return `
      <div class="summary-section">
        <div class="summary-section-title">${title}</div>
        <div class="summary-text">${escapeHtml(text)}</div>
      </div>`;
  }

  async function toggleRead(id, isRead) {
    await fetch(`/api/articles/${id}/read`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ read: isRead }),
    });
    const article = allArticles.find(a => a.id === id);
    if (article) article.read = isRead;

    const card = document.getElementById(`card-${id}`);
    const check = card?.querySelector('.read-check');
    if (card) {
      card.classList.toggle('read', isRead);
      if (isRead) card.classList.remove('expanded');
    }
    if (check) check.classList.toggle('checked', isRead);

    const res = await fetch('/api/runs');
    const runs = await res.json();
    renderSidebar(runs);
    const item = document.getElementById(`run-${currentDate}`);
    if (item) item.classList.add('active');
  }

  function toggleExpand(id) {
    document.getElementById(`card-${id}`)?.classList.toggle('expanded');
  }

  // ── Post data cache (caption.txt + summary.txt) ──────────────────────────
  const postDataCache = {};

  async function loadPostData(date, id) {
    const key = `${date}/${id}`;
    if (postDataCache[key]) return postDataCache[key];
    try {
      const res = await fetch(`/api/posts/${date}/${id}`);
      if (!res.ok) return null;
      const data = await res.json();
      postDataCache[key] = data;
      if (data.caption) captionMap[id] = data.caption;
      return data;
    } catch { return null; }
  }

  async function toggleCaptionPanel(date, id) {
    const panel = document.getElementById(`ig-${id}`);
    if (!panel) return;
    const visible = panel.style.display !== 'none';
    if (visible) { panel.style.display = 'none'; return; }
    panel.style.display = 'block';
    const textEl = document.getElementById(`ig-text-${id}`);
    if (textEl && textEl.dataset.loaded !== '1') {
      const data = await loadPostData(date, id);
      if (textEl) {
        textEl.textContent = data?.caption || '(sem legenda)';
        textEl.dataset.loaded = '1';
      }
    }
  }

  async function toggleSummaryPanel(date, id) {
    const panel = document.getElementById(`summary-panel-${id}`);
    if (!panel) return;
    const visible = panel.style.display !== 'none';
    if (visible) { panel.style.display = 'none'; return; }
    panel.style.display = 'block';
    const textEl = document.getElementById(`summary-text-${id}`);
    if (textEl && textEl.dataset.loaded !== '1') {
      const data = await loadPostData(date, id);
      if (textEl) {
        textEl.textContent = data?.summary || '(sem summary)';
        textEl.dataset.loaded = '1';
      }
    }
  }

  function openImageModal(date, id) {
    const modal = document.getElementById('imageModal');
    const img = document.getElementById('imageModalImg');
    if (!modal || !img) return;
    img.src = `/api/posts/${date}/${id}/background`;
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeImageModal() {
    document.getElementById('imageModal')?.classList.remove('open');
    document.body.style.overflow = '';
  }

  function handleModalClick(e) {
    if (e.target === document.getElementById('imageModal')) closeImageModal();
  }

  // ── Published state (localStorage) ──────────────────────────────────────
  const _PUB_KEY = 'cse_published_state';

  function _pubState() {
    try { return JSON.parse(localStorage.getItem(_PUB_KEY) || '{}'); }
    catch { return {}; }
  }

  function getPublishedState(date, id) {
    return !!_pubState()[`${date}/${id}`];
  }

  function savePublishedState(date, id, published) {
    try {
      const state = _pubState();
      if (published) {
        state[`${date}/${id}`] = true;
      } else {
        delete state[`${date}/${id}`];
      }
      localStorage.setItem(_PUB_KEY, JSON.stringify(state));
    } catch {}
  }

  async function togglePublished(date, id, published) {
    savePublishedState(date, id, published);
    const label = document.querySelector(`#card-${id} .published-label`);
    if (label) label.classList.toggle('checked', published);
    try {
      await fetch(`/api/posts/${date}/${id}/published`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ published }),
      });
    } catch (e) {
      console.error('Erro ao salvar estado de publicação no servidor', e);
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeImageModal();
  });

  async function copyCaption(id) {
    const text = captionMap[id] || '';
    await navigator.clipboard.writeText(text);
    const btn = document.getElementById(`copy-${id}`);
    if (!btn) return;
    btn.textContent = 'Copiado!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copiar legenda'; btn.classList.remove('copied'); }, 2000);
  }

  // ── Audio (TTS) ───────────────────────────────────────────────────────────
  let currentSpeakingId = null;

  const ICON_PLAY  = `<path d="M8 5v14l11-7z"/>`;
  const ICON_PAUSE = `<path d="M6 19h4V5H6zm8-14v14h4V5z"/>`;

  function buildArticleText(a) {
    const parts = [];
    if (a.title_pt || a.title) parts.push((a.title_pt || a.title) + '.');
    if (a.objective)       parts.push('Objetivo. ' + a.objective);
    if (a.conclusion)      parts.push('Conclusão. ' + a.conclusion);
    if (a.supporting_data) parts.push('Dados de suporte. ' + a.supporting_data);
    return parts.join('\n\n');
  }

  function setPlayState(id, state) {
    const btn   = document.getElementById(`play-${id}`);
    const icon  = document.getElementById(`play-icon-${id}`);
    const label = document.getElementById(`play-label-${id}`);
    if (!btn) return;
    if (state === 'playing') {
      btn.classList.add('playing');
      icon.innerHTML = ICON_PAUSE;
      label.textContent = 'Pausar';
    } else if (state === 'paused') {
      btn.classList.add('playing');
      icon.innerHTML = ICON_PLAY;
      label.textContent = 'Retomar';
    } else {
      btn.classList.remove('playing');
      icon.innerHTML = ICON_PLAY;
      label.textContent = 'Ouvir';
    }
  }

  function toggleAudio(id) {
    if (currentSpeakingId === id) {
      if (speechSynthesis.paused) {
        speechSynthesis.resume();
        setPlayState(id, 'playing');
      } else {
        speechSynthesis.pause();
        setPlayState(id, 'paused');
      }
      return;
    }

    if (currentSpeakingId) {
      speechSynthesis.cancel();
      setPlayState(currentSpeakingId, 'idle');
    }

    const article = allArticles.find(a => a.id === id);
    if (!article) return;

    const utterance = new SpeechSynthesisUtterance(buildArticleText(article));
    utterance.lang = 'pt-BR';
    utterance.rate = 1.0;
    utterance.onend = () => { currentSpeakingId = null; setPlayState(id, 'idle'); };
    utterance.onerror = () => { currentSpeakingId = null; setPlayState(id, 'idle'); };

    currentSpeakingId = id;
    setPlayState(id, 'playing');
    speechSynthesis.cancel();
    speechSynthesis.speak(utterance);
  }

  function stopAudio() {
    if (currentSpeakingId) {
      speechSynthesis.cancel();
      setPlayState(currentSpeakingId, 'idle');
      currentSpeakingId = null;
    }
  }

  // ── Sidebar (mobile) ──────────────────────────────────────────────────────
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const isOpen = sidebar.classList.toggle('open');
    overlay.classList.toggle('open', isOpen);
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('open');
  }

  // ── Run research ──────────────────────────────────────────────────────────
  async function runResearch() {
    const btn = document.getElementById('runBtn');
    const msg = document.getElementById('statusMsg');
    btn.disabled = true;
    btn.innerHTML = `<svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg><span class="btn-label"> Pesquisando...</span>`;
    msg.textContent = 'Isso pode levar alguns minutos...';

    const res = await fetch('/api/research/run', { method: 'POST' });
    if (res.status === 409) {
      msg.textContent = 'Já está rodando...';
      btn.disabled = false;
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4V8z" fill="currentColor" stroke="none"/></svg><span class="btn-label"> Nova pesquisa</span>`;
      return;
    }

    clearInterval(pollingInterval);
    pollingInterval = setInterval(async () => {
      const s = await fetch('/api/research/status').then(r => r.json());
      if (s.status === 'done') {
        clearInterval(pollingInterval);
        btn.disabled = false;
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4V8z" fill="currentColor" stroke="none"/></svg><span class="btn-label"> Nova pesquisa</span>`;
        msg.textContent = s.exit_code === 0 ? 'Pesquisa concluída' : 'Erro ao pesquisar';
        setTimeout(() => { msg.textContent = ''; }, 5000);
        if (s.exit_code === 0) loadRuns();
      }
    }, 5000);
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function renderSkeletons() {
    return Array.from({length: 4}).map(() => `
      <div class="card">
        <div class="skeleton sk-title"></div>
        <div class="skeleton sk-line" style="width:45%"></div>
        <div style="margin-top:14px">
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line" style="width:70%"></div>
        </div>
      </div>`).join('');
  }

  function formatDateLabel(date) {
    if (!date) return '';
    try {
      const [year, month, day] = date.split('-');
      const d = new Date(Number(year), Number(month) - 1, Number(day));
      return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
    } catch { return date; }
  }

  function formatTime(iso) {
    if (!iso) return '';
    try {
      return new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    } catch { return iso; }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function escapeAttr(str) {
    if (!str) return '';
    return str.replace(/'/g,"\\'");
  }

  // ── Tabs ──────────────────────────────────────────────────────────────────
  let currentTab = 'research';

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tab-research').classList.toggle('active', tab === 'research');
    document.getElementById('tab-queue').classList.toggle('active', tab === 'queue');
    document.getElementById('sidebar').style.display = tab === 'research' ? '' : 'none';
    document.getElementById('content').style.display = tab === 'research' ? '' : 'none';
    document.getElementById('queue-content').style.display = tab === 'queue' ? '' : 'none';
    if (tab === 'queue') loadQueue();
  }

  // ── Review Queue ──────────────────────────────────────────────────────────
  let allPosts = [];
  let queueFilter = 'PENDING_REVIEW';

  async function loadQueue() {
    const el = document.getElementById('queue-content');
    el.innerHTML = '<div class="state-msg"><strong>Carregando fila...</strong></div>';
    try {
      const res = await fetch('/api/posts');
      allPosts = await res.json();
      renderQueue();
      updateQueueBadge();
    } catch (e) {
      el.innerHTML = '<div class="state-msg"><strong>Erro ao carregar fila</strong></div>';
    }
  }

  async function updateQueueBadge() {
    try {
      const res = await fetch('/api/posts/stats');
      const stats = await res.json();
      const badge = document.getElementById('queue-badge');
      const count = (stats.PENDING_REVIEW || 0);
      if (count > 0) {
        badge.textContent = count;
        badge.style.display = '';
      } else {
        badge.style.display = 'none';
      }
    } catch (_) {}
  }

  function renderQueue() {
    const el = document.getElementById('queue-content');
    const filtered = queueFilter === 'all' ? allPosts : allPosts.filter(p => p.status === queueFilter);

    const counts = { APPROVED: 0, PENDING_REVIEW: 0, REJECTED: 0, NO_EVAL: 0 };
    allPosts.forEach(p => { counts[p.status] = (counts[p.status] || 0) + 1; });

    const filters = [
      { key: 'PENDING_REVIEW', label: 'Aguardando revisão', badge: counts.PENDING_REVIEW },
      { key: 'APPROVED',       label: 'Aprovados',          badge: counts.APPROVED },
      { key: 'REJECTED',       label: 'Rejeitados',         badge: counts.REJECTED },
      { key: 'all',            label: 'Todos',              badge: allPosts.length },
    ];

    el.innerHTML = `
      <div class="review-header">
        <div>
          <div class="main-title">Fila de publicação</div>
          <div class="main-meta">${allPosts.length} posts gerados · ${counts.APPROVED} aprovados · ${counts.PENDING_REVIEW} aguardando</div>
        </div>
      </div>
      <div class="review-filters" style="margin-bottom:24px">
        ${filters.map(f => `
          <button class="filter-btn ${queueFilter === f.key ? 'active' : ''}" onclick="setQueueFilter('${f.key}')">
            ${f.label}${f.badge > 0 ? ` <span style="opacity:.7">(${f.badge})</span>` : ''}
          </button>`).join('')}
      </div>
      <div id="reviewList">
        ${filtered.length === 0
          ? '<div class="state-msg" style="padding:40px 20px"><strong>Nenhum post</strong>Nenhum post com este status.</div>'
          : filtered.map(renderReviewCard).join('')}
      </div>`;
  }

  function setQueueFilter(filter) {
    queueFilter = filter;
    renderQueue();
  }

  function renderReviewCard(post) {
    const eval_ = post.eval || {};
    const auto = eval_.auto || {};
    const llm = eval_.llm || null;

    const summaryTitle = extractSummaryTitle(post.summary);
    const pilar = extractSummaryPilar(post.summary);

    const autoScore = auto.score != null ? Math.round(auto.score * 100) : null;
    const llmScore = llm ? Math.round(llm.score_normalized * 100) : null;

    function scoreClass(val) {
      if (val == null) return '';
      return val >= 72 ? 'good' : val < 52 ? 'bad' : '';
    }

    const failures = (auto.failures || []).map(f =>
      `<div style="font-size:12px;color:var(--color-danger);margin-top:3px">${escapeHtml(f)}</div>`
    ).join('');

    const llmDetails = llm ? `
      <div class="eval-scores" style="margin-top:8px">
        ${[
          ['Voz da marca', llm.brand_alignment],
          ['Gancho',       llm.hook_quality],
          ['Ciência',      llm.scientific_clarity],
          ['Pilar',        llm.pilar_fit],
          ['CTA',          llm.cta_effectiveness],
        ].map(([label, val]) => `
          <div class="score-chip ${val >= 4 ? 'good' : val <= 2 ? 'bad' : ''}">
            ${label} <span class="score-val">${val}/5</span>
          </div>`).join('')}
      </div>
      ${llm.feedback ? `
      <div class="llm-feedback" style="margin-top:12px">
        <div class="llm-feedback-label">Feedback do avaliador</div>
        <div class="llm-feedback-text">${escapeHtml(llm.feedback)}</div>
      </div>` : ''}` : '';

    const notes = eval_.notes || '';

    return `
      <div class="review-card" id="rcard-${post.date}-${post.id}">
        <div class="review-card-header" onclick="toggleReviewCard('${post.date}', '${post.id}')">
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <span class="status-pill ${post.status}">${statusLabel(post.status)}</span>
              ${pilar ? `<span style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em">${escapeHtml(pilar)}</span>` : ''}
            </div>
            <div class="review-card-title" style="margin-top:6px">${escapeHtml(summaryTitle || post.id)}</div>
            <div class="review-card-meta">${post.date}${post.has_image ? ' · imagem gerada' : ''}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">
            ${autoScore != null ? `<div class="score-chip ${scoreClass(autoScore)}">Auto <span class="score-val">${autoScore}%</span></div>` : ''}
            ${llmScore  != null ? `<div class="score-chip ${scoreClass(llmScore)}">LLM <span class="score-val">${llmScore}%</span></div>`  : ''}
          </div>
        </div>
        <div class="review-card-body" id="rbody-${post.date}-${post.id}" style="display:none">
          <div class="eval-scores">
            ${autoScore != null ? `<div class="score-chip ${scoreClass(autoScore)}">Score auto: <span class="score-val">${autoScore}%</span></div>` : ''}
            ${failures}
          </div>
          ${llmDetails}
          <div class="review-content-grid">
            <div class="review-content-box">
              <div class="review-content-label">Texto da imagem (summary.txt)</div>
              <div class="review-content-text">${escapeHtml(post.summary)}</div>
            </div>
            <div class="review-content-box">
              <div class="review-content-label">Legenda (caption.txt)</div>
              <div class="review-content-text">${escapeHtml(post.caption)}</div>
            </div>
          </div>
          <div class="review-actions">
            <textarea class="review-note-input" id="note-${post.date}-${post.id}" placeholder="Nota de rejeição (opcional)..." rows="2">${escapeHtml(notes)}</textarea>
            <button class="btn-approve" onclick="approvePost('${post.date}', '${post.id}')">Aprovar</button>
            <button class="btn-reject" onclick="rejectPost('${post.date}', '${post.id}')">Rejeitar</button>
          </div>
        </div>
      </div>`;
  }

  function toggleReviewCard(date, id) {
    const body = document.getElementById(`rbody-${date}-${id}`);
    if (!body) return;
    body.style.display = body.style.display === 'none' ? 'block' : 'none';
    const card = document.getElementById(`rcard-${date}-${id}`);
    if (card) card.classList.toggle('expanded', body.style.display !== 'none');
  }

  async function approvePost(date, id) {
    await fetch(`/api/posts/${date}/${id}/approve`, { method: 'POST' });
    await loadQueue();
  }

  async function rejectPost(date, id) {
    const notes = document.getElementById(`note-${date}-${id}`)?.value || '';
    await fetch(`/api/posts/${date}/${id}/reject`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ notes }),
    });
    await loadQueue();
  }

  function extractSummaryTitle(summary) {
    if (!summary) return '';
    const match = summary.match(/^TITULO:\s*(.+)/m);
    return match ? match[1].trim() : '';
  }

  function extractSummaryPilar(summary) {
    if (!summary) return '';
    const match = summary.match(/^PILAR:\s*(.+)/m);
    return match ? match[1].trim() : '';
  }

  function statusLabel(status) {
    const labels = {
      APPROVED:       'Aprovado',
      PENDING_REVIEW: 'Aguardando revisão',
      REJECTED:       'Rejeitado',
      NO_EVAL:        'Sem avaliação',
    };
    return labels[status] || status;
  }

  // Load queue badge on boot
  updateQueueBadge();
</script>
</body>
</html>
